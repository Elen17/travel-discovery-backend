name: Build & Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build → Push ECR → Deploy EC2
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Set up JDK (for Maven build inside Docker — layer cache only) ────
      #    The actual build happens inside the Docker multi-stage build.
      #    We configure QEMU + Buildx so we can target linux/amd64 from any runner.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 3. Authenticate with AWS ─────────────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # ── 4. Log in to ECR ─────────────────────────────────────────────────────
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ── 5. Build & push image ────────────────────────────────────────────────
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.ECR_REPOSITORY }}:latest
            ${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── 6. SSH into EC2 and restart the app ──────────────────────────────────
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/travel-discovery

            # Pull the new image
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} \
              | docker login --username AWS --password-stdin \
                $(echo ${{ secrets.ECR_REPOSITORY }} | cut -d'/' -f1)

            ECR_IMAGE=${{ secrets.ECR_REPOSITORY }}:latest \
              docker compose -f docker-compose.ec2.yml pull

            ECR_IMAGE=${{ secrets.ECR_REPOSITORY }}:latest \
              docker compose -f docker-compose.ec2.yml up -d

            # Clean up old images to save disk space
            docker image prune -f
