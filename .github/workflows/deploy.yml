name: Deploy to Railway

# Optional CI deploy (see RAILWAY.md → "Continuous deploys").
# If you use Railway's native GitHub integration instead, delete this file to
# avoid deploying twice on the same push.

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      # Builds the Dockerfile on Railway and deploys to the target service.
      # RAILWAY_TOKEN (secret): project-scoped token from Railway → Settings → Tokens.
      # RAILWAY_SERVICE (variable): the service name, e.g. travel-discovery-backend.
      - name: Deploy
        run: railway up --service "$RAILWAY_SERVICE" --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
