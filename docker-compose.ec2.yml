# ── EC2 Free Tier Deployment ──────────────────────────────────────────────────
# PostgreSQL → managed by RDS (external, free tier)
# Redis      → runs as a container here
# S3         → managed by AWS (external)
#
# Usage on the EC2 instance:
#   docker compose -f docker-compose.ec2.yml up -d

services:

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: travel_redis
    restart: always
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Spring Boot Application ──────────────────────────────────────────────────
  app:
    image: ${ECR_IMAGE}               # e.g. 123456789.dkr.ecr.us-east-1.amazonaws.com/travel-discovery:latest
    container_name: travel_app
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env.prod
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      STORAGE_PROVIDER: s3
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - ./logs:/app/logs

volumes:
  redis_data:
