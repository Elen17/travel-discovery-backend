# ── Production / AWS ──────────────────────────────────────────────────────────
# Uses managed AWS services: RDS (PostgreSQL), ElastiCache (Redis), S3
# Run with: docker compose -f docker-compose.prod.yml up -d
#
# Expected env vars (set in your CI secrets or EC2 instance profile):
#   DB_URL, DB_USERNAME, DB_PASSWORD
#   REDIS_HOST, REDIS_PORT, REDIS_PASSWORD
#   AWS_REGION, AWS_S3_BUCKET, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
#   JWT_SECRET, ADMIN_RELOAD_TOKEN, RAPIDAPI_KEY, FRONTEND_URL

services:

  app:
    image: ${ECR_IMAGE:-travel-discovery-backend:latest}
    container_name: travel_app
    restart: always
    env_file:
      - .env.prod
    environment:
      STORAGE_PROVIDER: s3
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - ./logs:/app/logs
    logging:
      driver: awslogs
      options:
        awslogs-group: /travel-discovery/app
        awslogs-region: ${AWS_REGION:-us-east-1}
        awslogs-stream-prefix: app
