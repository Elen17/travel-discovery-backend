# ── Local Development ─────────────────────────────────────────────────────────
# Includes: PostgreSQL, Redis, MinIO (S3-compatible local storage)
# Usage:
#   cp .env.example .env.docker && fill in values
#   docker compose up --build
# Swagger UI: http://localhost:8080/swagger-ui.html
# MinIO console: http://localhost:9001  (minioadmin / minioadmin)

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: travel_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: travel_discovery
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d travel_discovery"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: travel_redis
    restart: unless-stopped
    command: >
      redis-server
      ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO (S3-compatible local storage) ─────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: travel_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO bucket initializer ─────────────────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: travel_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/${AWS_S3_BUCKET:-travel-discovery-local} &&
        mc anonymous set download local/${AWS_S3_BUCKET:-travel-discovery-local}/avatars
      "

  # ── Spring Boot Application ──────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: travel_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      # Override DB URL to point at the containerised postgres
      DB_URL: jdbc:postgresql://db:5432/travel_discovery
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Point to local MinIO for S3-compatible storage
      STORAGE_PROVIDER: s3
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-travel-discovery-local}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_S3_ENDPOINT_URL: http://minio:9000
      AWS_S3_PUBLIC_URL: http://localhost:9000/${AWS_S3_BUCKET:-travel-discovery-local}
      APP_BASE_URL: http://localhost:8080
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - uploads_data:/app/uploads
      - ./logs:/app/logs

volumes:
  postgres_data:
  redis_data:
  minio_data:
  uploads_data:
