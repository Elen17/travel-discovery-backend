# Railway deployment config — see RAILWAY.md for full setup.
# Railway builds the existing multi-stage Dockerfile; no AWS services required.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Dependency-free liveness probe (HealthController) — see /health.
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
numReplicas = 1
