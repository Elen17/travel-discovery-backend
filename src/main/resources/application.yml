spring:
  application:
    name: travel-discovery-backend

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 2000ms

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

jwt:
  secret: ${JWT_SECRET:change-me-in-production-must-be-at-least-256-bits-long-secret-key!!}
  expiration-ms: ${JWT_EXPIRATION_MS:1800000}
  refresh-expiration-ms: ${JWT_REFRESH_MS:604800000}

# Privileged ops (e.g. POST /api/v1/admin/cache/reload), guarded by a fixed token
# sent in the `jwt-token` header and compared against this value.
admin:
  reload-token: ${ADMIN_RELOAD_TOKEN:}

cors:
  allowed-origins: ${FRONTEND_URL:http://localhost:5173}

# Profile-image storage. 'local' writes to disk for development (no AWS needed);
# production overrides this to 's3' in application-prod.yml.
storage:
  provider: ${STORAGE_PROVIDER:local}
  local:
    directory: ${STORAGE_LOCAL_DIR:uploads}
    base-url: ${APP_BASE_URL:http://localhost:8080}

rapidapi:
  key: ${RAPIDAPI_KEY:}
  host: booking-com15.p.rapidapi.com
  quota:
    limit: 500
  sync:
    # Hotels re-synced more recently than this (hours) are not re-fetched/updated,
    # so repeated searches for the same city don't burn quota.
    ttl-hours: ${RAPIDAPI_SYNC_TTL_HOURS:24}

# Cache TTL for location reference data (countries / cities) served from the DB
location:
  cache:
    ttl-seconds: 86400

logging:
  level:
    com.travel.discovery: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO
  file:
    name: logs/app.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 5
