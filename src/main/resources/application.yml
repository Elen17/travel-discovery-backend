spring:
  application:
    name: travel-discovery-backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway owns the schema — never let Hibernate touch it
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

# ── JWT ──────────────────────────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET:change-me-in-production-must-be-at-least-256-bits-long-secret-key!!}
  expiration-ms: ${JWT_EXPIRATION_MS:900000}         # 15 minutes
  refresh-expiration-ms: ${JWT_REFRESH_MS:604800000} # 7 days

# ── CORS ─────────────────────────────────────────────────────────────────────
cors:
  allowed-origins: ${FRONTEND_URL:http://localhost:5173}

# ── RapidAPI (Booking.com hotel data) ────────────────────────────────────────
# Get your key at https://rapidapi.com → subscribe to booking-com15
rapidapi:
  key: ${RAPIDAPI_KEY:your_rapidapi_key_here}
  host: booking-com15.p.rapidapi.com
  quota:
    limit: 500  # Free tier = 500 calls/month

# ── Logging ──────────────────────────────────────────────────────────────────
logging:
  level:
    com.traveldiscovery: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO
  file:
    name: logs/app.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 5
