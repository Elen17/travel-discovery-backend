spring:
  application:
    name: travel-discovery-backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

jwt:
  secret: ${JWT_SECRET:change-me-in-production-must-be-at-least-256-bits-long-secret-key!!}
  expiration-ms: ${JWT_EXPIRATION_MS:1800000}
  refresh-expiration-ms: ${JWT_REFRESH_MS:604800000}

cors:
  allowed-origins: ${FRONTEND_URL:http://localhost:5173}

rapidapi:
  key: ${RAPIDAPI_KEY:placeholder_set_in_env}
  host: booking-com15.p.rapidapi.com
  quota:
    limit: 500

csc:
  api:
    base-url: https://api.countrystatecity.in/v1
    # FIX: Added empty default so app starts without CSC_API_KEY set
    # (it will fail at runtime only when a location endpoint is called)
    key: ${CSC_API_KEY:}
  cache:
    ttl-seconds: 86400

logging:
  level:
    com.travel.discovery: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO
  file:
    name: logs/app.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 5
